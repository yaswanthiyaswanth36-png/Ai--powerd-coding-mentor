{% extends "base.html" %}
{% block content %}
<div class="card">
<h2>{{ 'Edit Book' if book else 'Add Book' }}</h2>
<form method="post">
<label>Title</label><input name="title" value="{{ book.title if book else '' }}" required>
<label>Author</label><input name="author" value="{{ book.author if book else '' }}" required>
<label>Category</label><input name="category" value="{{ book.category if book else '' }}" required>
<label>Number of Copies</label><input name="copies" type="number" min="1" value="{{ book.total_copies if book else 1 }}" required>
<button type="submit">Save</button>
</form>
</div>
{% endblock %}
